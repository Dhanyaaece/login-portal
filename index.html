<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Payroll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:light;
    --purple:#7C3AED;
    --purple-dark:#6D28D9;
    --purple-tint:#F3ECFE;
    --pink:#D946A0;
    --bg:#F5F5F7;
    --card:#FFFFFF;
    --border:#ECECEF;
    --text:#17171C;
    --text-dim:#8A8D98;
    --green:#16A34A;
    --green-tint:#E9F8EE;
    --red:#DC2626;
    --red-tint:#FDECEC;
    --blue:#2563EB;
    --blue-tint:#EAF1FF;
    --amber:#D97706;
    --amber-tint:#FEF3E2;
    --radius:16px;
    --radius-sm:10px;
    --shadow:0 4px 20px rgba(20,20,30,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-variant-numeric:tabular-nums;}
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;}
  svg{display:block;}
  :focus-visible{outline:2px solid var(--purple); outline-offset:2px; border-radius:6px;}

  .app{display:flex; min-height:100vh;}

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:248px; flex-shrink:0; background:var(--card);
    border-right:1px solid var(--border);
    padding:24px 16px; display:flex; flex-direction:column;
    max-height:100vh; position:sticky; top:0; overflow-y:auto;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:0 8px 22px;}
  .brand-mark{
    width:32px; height:32px; border-radius:9px;
    background:linear-gradient(135deg, var(--purple), var(--pink));
    position:relative; flex-shrink:0;
  }
  .brand-mark::after{content:""; position:absolute; inset:9px; background:#fff; border-radius:3px;}
  .brand-name{font-size:17px; font-weight:700; letter-spacing:-0.01em;}

  nav.side-nav{display:flex; flex-direction:column; gap:2px;}
  .nav-group>.nav-top{
    display:flex; align-items:center; gap:11px;
    padding:10px 12px; border-radius:10px;
    background:transparent; border:none; text-align:left; cursor:pointer;
    font-size:13.5px; font-weight:500; color:var(--text-dim);
    position:relative; width:100%;
  }
  .nav-top svg.ico{width:18px; height:18px; stroke:var(--text-dim); flex-shrink:0;}
  .nav-top .caret{margin-left:auto; font-size:9px; color:#C2C2CC; transition:transform .18s ease;}
  .nav-group.open>.nav-top .caret{transform:rotate(90deg);}
  .nav-group.current>.nav-top{background:var(--purple-tint); color:var(--purple-dark); font-weight:600;}
  .nav-group.current>.nav-top svg.ico{stroke:var(--purple);}
  .nav-group.current>.nav-top::before{
    content:""; position:absolute; left:-16px; top:8px; bottom:8px; width:3px;
    background:var(--purple); border-radius:0 3px 3px 0;
  }
  .nav-top:hover{background:#FAFAFB; color:var(--text);}
  .nav-group.current>.nav-top:hover{background:var(--purple-tint); color:var(--purple-dark);}
  .submenu{display:none; flex-direction:column; gap:1px; margin:2px 0 6px 15px; padding-left:11px; border-left:1px solid var(--border);}
  .nav-group.open .submenu{display:flex;}
  .submenu button{
    background:transparent; border:none; text-align:left; cursor:pointer;
    padding:7px 10px; border-radius:8px; font-size:12.5px; color:var(--text-dim); font-weight:500;
  }
  .submenu button:hover{background:#FAFAFB; color:var(--text);}
  .submenu button.on{background:var(--purple-tint); color:var(--purple-dark); font-weight:700;}

  .promo{
    margin-top:auto; margin-bottom:4px;
    background:linear-gradient(135deg, var(--purple), var(--pink));
    border-radius:var(--radius); padding:18px; color:#fff;
  }
  .promo p{margin:0 0 12px; font-size:12.5px; font-weight:600; line-height:1.4;}
  .promo button{
    width:100%; background:#fff; color:var(--purple-dark); border:none;
    border-radius:99px; padding:9px 0; font-size:12.5px; font-weight:700; cursor:pointer;
  }

  /* ---------- MAIN / TOPBAR ---------- */
  main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{display:flex; align-items:center; justify-content:space-between; padding:20px 32px; gap:20px;}
  .search-pill{
    display:flex; align-items:center; gap:10px;
    background:var(--card); border:1px solid var(--border);
    border-radius:999px; padding:0 16px; width:340px; max-width:44vw;
  }
  .search-pill svg{width:15px; height:15px; stroke:var(--text-dim); flex-shrink:0;}
  .search-pill input{border:none; outline:none; background:transparent; padding:11px 0; font-size:13px; width:100%; color:var(--text);}
  .search-pill input::placeholder{color:var(--text-dim);}
  .topbar-right{display:flex; align-items:center; gap:14px;}
  .month-pick{display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--border); border-radius:999px; padding:8px 14px; font-size:12.5px; font-weight:600;}
  .month-pick select{border:none; outline:none; background:transparent; font-size:12.5px; font-weight:600; color:var(--purple-dark); cursor:pointer;}
  .bell{position:relative; width:38px; height:38px; border-radius:50%; background:var(--card);
    border:1px solid var(--border); display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .bell svg{width:17px; height:17px; stroke:var(--text-dim);}
  .bell .dot{
    position:absolute; top:-3px; right:-3px; background:var(--red); color:#fff;
    font-size:9px; font-weight:700; width:16px; height:16px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }
  .avatar{
    width:38px; height:38px; border-radius:50%; border:none; cursor:pointer;
    background:linear-gradient(135deg,var(--purple),var(--pink));
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:700;
  }

  .content{padding:4px 32px 60px;}

  .crumb{font-size:12px; color:var(--text-dim); margin-bottom:12px;}
  .crumb b{color:var(--purple-dark); font-weight:600;}

  /* ---------- PAGE HEAD ---------- */
  .page-head{
    display:flex; justify-content:space-between; align-items:flex-start;
    gap:20px; flex-wrap:wrap; margin-bottom:22px;
  }
  .page-head h1{font-size:26px; margin:0 0 4px; font-weight:800; letter-spacing:-0.01em;}
  .page-head .sub{font-size:13px; color:var(--text-dim); max-width:70ch;}
  .head-actions{display:flex; gap:10px; flex-wrap:wrap;}

  .btn-primary{
    background:var(--purple); color:#fff; border:none; border-radius:var(--radius-sm);
    padding:11px 20px; font-size:13.5px; font-weight:600; cursor:pointer;
    box-shadow:0 6px 16px rgba(124,58,237,0.28);
  }
  .btn-primary:hover{background:var(--purple-dark);}
  .btn-primary:disabled{opacity:.45; cursor:not-allowed; box-shadow:none;}
  .btn-outline{
    background:var(--card); color:var(--text); border:1px solid var(--border);
    border-radius:var(--radius-sm); padding:10px 18px; font-size:13px; font-weight:600; cursor:pointer;
    display:inline-flex; align-items:center; gap:7px;
  }
  .btn-outline svg{width:14px; height:14px; stroke:var(--text);}
  .btn-outline:hover{border-color:#D8D8DE; background:#FCFCFD;}
  .btn-sm{padding:7px 13px; font-size:12px; border-radius:8px;}

  /* ---------- TABS ---------- */
  .tab-row{display:flex; gap:6px; background:#EEECF3; padding:4px; border-radius:999px; width:max-content; margin-bottom:22px; flex-wrap:wrap;}
  .tab-row button{
    background:transparent; border:none; padding:8px 18px; border-radius:999px;
    font-size:13px; font-weight:600; color:var(--text-dim); cursor:pointer;
  }
  .tab-row button.on{background:#fff; color:var(--purple-dark); box-shadow:0 2px 6px rgba(0,0,0,0.06);}

  .month-strip{display:flex; gap:8px; overflow-x:auto; margin-bottom:26px; padding-bottom:4px;}
  .month-strip button{
    flex-shrink:0; background:var(--card); border:1px solid var(--border); border-radius:999px;
    padding:8px 16px; font-size:12.5px; font-weight:600; color:var(--text-dim); cursor:pointer;
  }
  .month-strip button.active{background:var(--purple); border-color:var(--purple); color:#fff;}
  .month-strip button .locked-ico{margin-right:4px; font-size:10px;}

  /* ---------- STAT CARDS ---------- */
  .stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:18px; margin-bottom:24px;}
  .stat-card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px 20px;}
  .stat-icon{width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; margin-bottom:14px;}
  .stat-icon svg{width:17px; height:17px;}
  .stat-label{font-size:12.5px; color:var(--text-dim); font-weight:500; margin-bottom:6px;}
  .stat-value{font-size:22px; font-weight:800; letter-spacing:-0.01em;}
  .stat-trend{display:flex; align-items:center; gap:5px; margin-top:8px; font-size:11.5px; color:var(--green); font-weight:600;}
  .stat-trend svg{width:11px; height:11px; stroke:var(--green);}
  .stat-trend.flat{color:var(--text-dim);}
  .stat-trend.flat svg{stroke:var(--text-dim);}

  /* ---------- PANELS ---------- */
  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:24px; align-items:start;}
  .panel{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:22px; overflow:hidden;}
  .panel-head{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:18px 22px; border-bottom:1px solid var(--border); flex-wrap:wrap;}
  .panel-head h3{margin:0; font-size:15px; font-weight:700;}
  .panel-body{padding:20px 22px;}
  .table-wrap{overflow-x:auto;}

  .micro-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:20px;}
  .micro-cell{background:#FAFAFB; border-radius:12px; padding:14px 16px;}
  .micro-cell .ml{font-size:11.5px; color:var(--text-dim); margin-bottom:4px;}
  .micro-cell .mv{font-size:14.5px; font-weight:700;}
  .micro-cell .mv.accent{color:var(--purple);}

  .donut-row{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  .donut{width:88px; height:88px; border-radius:50%; position:relative; flex-shrink:0;}
  .donut::after{content:""; position:absolute; inset:14px; background:#fff; border-radius:50%;}
  .donut-legend{font-size:12px; color:var(--text-dim); line-height:1.9;}
  .donut-legend .sw{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px;}
  .donut-legend b{color:var(--text); font-weight:700;}
  .total-pay{display:flex; align-items:center; gap:10px; background:var(--purple-tint); border-radius:12px; padding:10px 14px;}
  .total-pay .lock{width:28px; height:28px; border-radius:8px; background:var(--purple); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .total-pay .lock svg{width:13px; height:13px; stroke:#fff;}
  .total-pay .tl{font-size:11px; color:var(--purple-dark); font-weight:600;}
  .total-pay .tv{font-size:15px; font-weight:800; color:var(--purple-dark);}

  .chart-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px; flex-wrap:wrap; gap:10px;}
  .chart-num{font-size:24px; font-weight:800;}
  .chart-badge{display:inline-flex; align-items:center; gap:4px; background:var(--green-tint); color:var(--green); font-size:11.5px; font-weight:700; border-radius:999px; padding:3px 9px; margin-left:8px;}
  .chart-cap{font-size:12px; color:var(--text-dim); margin-top:3px;}
  .legend-inline{display:flex; gap:14px; font-size:11.5px; color:var(--text-dim);}
  .legend-inline .sw{display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:5px;}

  /* Dynamic Interactive Bars with Tooltips */
  .bars{display:flex; align-items:flex-end; gap:18px; height:150px; padding-top:24px; position:relative;}
  .bar-group{flex:1; display:flex; align-items:flex-end; justify-content:center; gap:5px; height:100%; position:relative;}
  .bar-group .bar-tooltip{
    position:absolute; bottom:105%; left:50%; transform:translateX(-50%) translateY(4px);
    background:#17171C; color:#fff; padding:8px 12px; border-radius:10px;
    font-size:11.5px; line-height:1.45; white-space:nowrap; opacity:0; pointer-events:none;
    transition:all .18s cubic-bezier(.2,.8,.3,1); z-index:20;
    box-shadow:0 8px 24px rgba(0,0,0,0.24); border:1px solid rgba(255,255,255,0.1);
  }
  .bar-group .bar-tooltip::after{
    content:""; position:absolute; top:100%; left:50%; transform:translateX(-50%);
    border:6px solid transparent; border-top-color:#17171C;
  }
  .bar-group:hover .bar-tooltip{opacity:1; transform:translateX(-50%) translateY(0);}
  .bar{width:14px; border-radius:5px 5px 2px 2px; cursor:pointer; transition:transform .15s ease;}
  .bar-group:hover .bar{transform:scaleY(1.05);}
  .bar.a{background:linear-gradient(180deg,var(--purple),var(--purple-dark));}
  .bar.b{background:linear-gradient(180deg,#F3B8DA,var(--pink));}
  .bar-labels{display:flex; margin-top:10px;}
  .bar-labels span{flex:1; text-align:center; font-size:11.5px; color:var(--text-dim);}

  /* ---------- TABLES ---------- */
  .table-toolbar{display:flex; justify-content:space-between; align-items:center; padding:18px 22px; flex-wrap:wrap; gap:12px;}
  .table-toolbar h3{margin:0; font-size:15px; font-weight:700;}
  .toolbar-actions{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .mini-search{display:flex; align-items:center; gap:8px; background:#FAFAFB; border:1px solid var(--border); border-radius:10px; padding:0 12px;}
  .mini-search svg{width:13px; height:13px; stroke:var(--text-dim); flex-shrink:0;}
  .mini-search input{border:none; outline:none; background:transparent; padding:9px 0; font-size:12.5px; width:170px;}

  table.dtable{width:100%; border-collapse:collapse; min-width:640px;}
  table.dtable th{
    text-align:left; font-size:12px; font-weight:600; color:var(--text-dim);
    padding:10px 22px; border-top:1px solid var(--border); border-bottom:1px solid var(--border);
    background:#FAFAFB; white-space:nowrap;
  }
  table.dtable th .chev{font-size:9px; margin-left:3px; color:#C7C7CE;}
  table.dtable td{padding:14px 22px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:middle;}
  table.dtable tbody tr:last-child td{border-bottom:none;}
  table.dtable tbody tr:hover td{background:#FBFAFD;}
  .empty-row td{text-align:center; color:var(--text-dim); font-size:12.5px; padding:34px 22px !important;}
  .row-person{display:flex; align-items:center; gap:10px;}
  .row-avatar{width:30px; height:30px; border-radius:50%; background:var(--purple-tint); color:var(--purple-dark);
    display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:700; flex-shrink:0;}
  .row-name{font-weight:600;}
  .row-sub{font-size:11.5px; color:var(--text-dim);}

  .pill{display:inline-flex; align-items:center; padding:4px 12px; border-radius:999px; font-size:11.5px; font-weight:700; border:1.5px solid; white-space:nowrap;}
  .pill-purple{color:var(--purple-dark); border-color:var(--purple); background:var(--purple-tint);}
  .pill-green{color:var(--green); border-color:var(--green); background:var(--green-tint);}
  .pill-amber{color:var(--amber); border-color:var(--amber); background:var(--amber-tint);}
  .pill-grey{color:var(--text-dim); border-color:var(--border); background:#FAFAFB;}
  .pill-red{color:var(--red); border-color:var(--red); background:var(--red-tint);}
  .pill-blue{color:var(--blue); border-color:var(--blue); background:var(--blue-tint);}

  /* ---------- ROW LISTS ---------- */
  .row-item{display:flex; justify-content:space-between; align-items:center; gap:14px; padding:15px 0; border-bottom:1px solid var(--border); flex-wrap:wrap;}
  .row-item:last-child{border-bottom:none;}
  .ri-label{font-size:13.5px; font-weight:600;}
  .ri-sub{font-size:11.5px; color:var(--text-dim); margin-top:2px;}
  .link-btn{background:var(--purple-tint); color:var(--purple-dark); border:none; border-radius:8px; padding:7px 14px; font-size:12px; font-weight:700; cursor:pointer;}
  .link-btn:hover{background:#E9DDFB;}

  .switch2{display:flex; background:#EEECF3; border-radius:999px; padding:3px; width:max-content;}
  .switch2 button{background:transparent; border:none; padding:7px 16px; border-radius:999px; font-size:12px; font-weight:600; color:var(--text-dim); cursor:pointer;}
  .switch2 button.state-on{background:var(--purple); color:#fff;}

  /* ---------- FORMS (admin insert) ---------- */
  .form-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; align-items:end;}
  .field{display:flex; flex-direction:column; gap:6px; min-width:0;}
  .field label{font-size:11.5px; color:var(--text-dim); font-weight:600;}
  .field input,.field select,.field textarea{
    border:1px solid var(--border); background:#FAFAFB; border-radius:10px;
    padding:10px 12px; font-size:13px; color:var(--text); outline:none; width:100%;
  }
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--purple); background:#fff;}
  .field .err{font-size:11px; color:var(--red); display:none;}
  .field.invalid input,.field.invalid select{border-color:var(--red); background:var(--red-tint);}
  .field.invalid .err{display:block;}
  .form-actions{display:flex; gap:10px; align-items:end;}

  .filter-bar{display:flex; gap:12px; align-items:end; flex-wrap:wrap; background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px 22px; margin-bottom:22px;}
  .filter-bar .field{min-width:180px;}
  .filter-bar .grow{flex:1;}

  .note{background:var(--blue-tint); border-radius:12px; padding:13px 16px; font-size:12.5px; color:#1E40AF; margin-bottom:20px; display:flex; gap:10px; align-items:flex-start;}
  .note b{font-weight:700;}

  /* ---------- PROCESS PIPELINE STEPPER ---------- */
  .proc-stepper{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin-bottom:24px;}
  .proc-step{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px; position:relative; display:flex; flex-direction:column; justify-content:space-between; transition:all 0.2s ease; box-shadow:var(--shadow);}
  .proc-step:hover{border-color:var(--purple); box-shadow:0 6px 20px rgba(124,58,237,0.08);}
  .proc-step.active{border-color:var(--purple); background:linear-gradient(180deg,#fff 0%,#F5F3FF 100%);}
  .proc-step.completed{border-color:#BBF7D0; background:linear-gradient(180deg,#fff 0%,#F0FDF4 100%);}
  .proc-step-num{width:28px; height:28px; border-radius:50%; background:var(--purple-tint); color:var(--purple); font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center; margin-bottom:12px;}
  .proc-step.completed .proc-step-num{background:#DCFCE7; color:#15803D;}
  .proc-step-title{font-weight:700; font-size:14.5px; margin-bottom:4px; color:var(--text);}
  .proc-step-sub{font-size:12px; color:var(--text-dim); margin-bottom:14px; line-height:1.4;}
  .proc-step-foot{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:auto; flex-wrap:wrap;}

  /* ---------- CHECKLIST / KV ---------- */
  .check-row{display:flex; align-items:flex-start; gap:12px; padding:12px 0; border-bottom:1px solid var(--border);}
  .check-row:last-child{border-bottom:none;}
  .check-row input{margin-top:3px; width:16px; height:16px; accent-color:var(--purple); flex-shrink:0;}
  .check-row label{font-size:13.5px; font-weight:500;}

  .kv-table{width:100%; border-collapse:collapse; font-size:13px;}
  .kv-table td{padding:11px 0; border-bottom:1px solid var(--border);}
  .kv-table tr:last-child td{border-bottom:none;}
  .kv-table td:first-child{color:var(--text-dim); width:44%;}
  .kv-table td:last-child{font-weight:600;}

  /* ---------- MODAL ---------- */
  .overlay{display:none; position:fixed; inset:0; background:rgba(20,20,30,0.45); z-index:50; align-items:center; justify-content:center; padding:20px;}
  .overlay.show{display:flex;}
  .modal{background:#fff; border-radius:20px; width:520px; max-width:100%; max-height:88vh; overflow-y:auto; padding:28px; box-shadow:0 20px 60px rgba(0,0,0,0.25);}
  .modal h3{margin:0 0 4px; font-size:18px; font-weight:800;}
  .modal p.mp{margin:0 0 16px; font-size:12.5px; color:var(--text-dim);}
  .modal-actions{display:flex; gap:10px; margin-top:20px; flex-wrap:wrap;}

  /* ---------- DOCUMENT ---------- */
  .doc-modal{background:#fff; border-radius:16px; width:720px; max-width:100%; max-height:90vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,0.25);}
  #docBody{padding:34px 38px;}
  .ps-head{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; border-bottom:2px solid var(--text); padding-bottom:16px; margin-bottom:20px; flex-wrap:wrap;}

<script>
/* ============================================================
   1. DATA
   ============================================================ */
var PERIODS = ['Apr 2026','May 2026','Jun 2026','Jul 2026','Aug 2026','Sep 2026','Oct 2026','Nov 2026','Dec 2026'];
var LOCKED  = ['Apr 2026','May 2026','Jun 2026','Jul 2026'];
var FY = '2026 – 2027';
var state = { period:'Aug 2026', section:'payroll', view:'org', empFocus:'ECLCT3023', currentUser:'Sarulatha' };

function daysInPeriod(p){
  if(!p) return 31;
  var m = String(p).split(' ')[0];
  if(m === 'Feb') return 28;
  if(['Apr','Jun','Sep','Nov'].indexOf(m) >= 0) return 30;
  return 31;
}

function mk(id,name,desig,dept,basic,bank,acct,uan,pan,doj,status,dailyRate,workDays){
  var hra=Math.round(basic*0.5), spl=Math.round(basic*0.5);
  var gross=basic+hra+spl;
  var wDays = Number(workDays) || 31;
  var dRate = Number(dailyRate) || Math.max(100, Math.round(gross / wDays));
  var pf=Math.min(Math.round(basic*0.12),1800*2), pt=200, tds=Math.round(gross*0.019/10)*10;
  return {id:id,name:name,desig:desig,dept:dept,basic:basic,hra:hra,spl:spl,gross:gross,
          dailyRate:dRate, workDays:wDays,
          pf:pf,pt:pt,tds:tds,net:gross-(pf+pt+tds),bank:bank,acct:acct,uan:uan,pan:pan,
          doj:doj,status:status,lop:0};
}
var EMP = [

  mk('ECLCT3040','Arun Prakash','Associate Consultant','Consulting',27800,'HDFC Bank','••••5518','100844719911','DXXAP4412F','11 Nov 2025','Probation',1794,31),
  mk('ECLCM1001','Somu Chinnusamy','Principal Architect','Engineering',48000,'ICICI Bank','••••1187','100844716620','EXXSC7745G','02 Feb 2026','Confirmed',3097,31),
  mk('ECLCE2001','Deepa Rajan','Finance Analyst','Finance',22500,'SBI','••••6640','100844715539','FXXDR2213H','08 Sep 2025','Confirmed',1452,31),
  mk('ECLCE2002','Sivaranjini S','UI Designer','Design',21000,'HDFC Bank','••••3327','100844714418','GXXSS8890J','10 Dec 2025','Probation',1355,31),
  mk('ECLCM1003','Madheswaran S','Delivery Manager','Delivery',38500,'ICICI Bank','••••9903','100844713307','HXXMS6654K','01 Sep 2025','Confirmed',2484,31)
];
function emp(id){ for(var i=0;i<EMP.length;i++){ if(EMP[i].id===id) return EMP[i]; } return EMP[0]; }

/* mutable records — every insert button writes here */
var DB = {
  lop:[{emp:'ECLCT3040',period:'Aug 2026',days:1,reason:'Unapproved leave',by:'Sarulatha'}],
  adhoc:[{emp:'ECLCT3011',period:'Aug 2026',head:'Performance Bonus',amount:5000,taxable:'Yes'}],
  reimb:[{emp:'ECLCT3023',period:'Aug 2026',head:'Fuel',claimed:4200,approved:4200,status:'Approved'},
         {emp:'ECLCM1001',period:'Aug 2026',head:'Internet',claimed:1800,approved:1500,status:'Approved'}],
  loans:[{emp:'ECLCT2987',type:'Salary Advance',principal:60000,emi:5000,paid:25000,start:'Apr 2026'}],
  stop:[],
  itax:[{emp:'ECLCT3023',regime:'New Regime',projected:824000,tds:14400}],
  revision:[{emp:'ECLCT3023',effective:'01 Oct 2026',oldCtc:762000,newCtc:838000,reason:'Annual review',status:'Planned'}],
  remit:[{head:'EPF',period:'Jul 2026',amount:46800,due:'15 Aug 2026',status:'Paid',ref:'EPF/2026/07/8841'},
         {head:'Professional Tax',period:'Jul 2026',amount:1600,due:'15 Aug 2026',status:'Paid',ref:'PT/TN/2026/07'},
         {head:'TDS (24Q)',period:'Aug 2026',amount:21460,due:'07 Sep 2026',status:'Pending',ref:'—'}],
  pan:[],

  users:[{name:'Sarulatha',role:'Payroll Admin',access:'Full Access',email:'sarulatha@eclearnix.com'},
         {name:'Priya Natarajan',role:'HR Executive',access:'Restricted',email:'priya@eclearnix.com'}],
  audit:[{action:'Payroll processed',user:'Sarulatha',ts:'15 Sep 2026, 12:10 PM'},
         {action:'Payslips released',user:'Sarulatha',ts:'15 Sep 2026, 12:14 PM'}],
  published:[{doc:'Payslip',cycle:'Aug 2026',count:34,on:'15 Sep 2026',status:'Published'},
              {doc:'IT Statement',cycle:FY,count:34,on:'01 Aug 2026',status:'Published'}],
  generated:[],
  jv:null, bankFile:null,
  attendance:[
    {emp:'ECLCT3023',period:'Aug 2026',workingDays:31,dailyRate:2048,present:31,paidLeave:0,lop:0,payableDays:31},
    {emp:'ECLCT3040',period:'Aug 2026',workingDays:31,dailyRate:1794,present:29,paidLeave:1,lop:1,payableDays:30}
  ],
  salaryLock:{},
  qsCustomValues:{}
};
function log(action){ DB.audit.unshift({action:action,user:state.currentUser,ts:stamp()}); }

/* ---------- Admin-editable payslip / company settings ---------- */
var SETTINGS = {
  companyName:'Eclearnix Edtech Pvt Ltd',
  companyAddress:'Coimbatore, Tamil Nadu, India',
  companyTagline:'Payroll Statement',
  logoDataUrl:null,
  companySealDataUrl:null,
  payslipLabels:{ basic:'Basic', hra:'House Rent Allowance', spl:'Special Allowance',
    pf:'Provident Fund', pt:'Professional Tax', tds:'Income Tax (TDS)' },
  signatories:[
    {name:'Sarulatha', title:'Payroll Admin', role:'Prepared by', signDataUrl:null},
    {name:'Priya Natarajan', title:'HR Executive', role:'Verified by', signDataUrl:null},
    {name:'', title:'Finance Head', role:'Approved by', signDataUrl:null}
  ],
  qsColumns:[
    {key:'days', label:'Days (30/31)', on:true},

    {key:'paidLeave', label:'Paid Leave', on:false},

    {key:'payable', label:'Payable Days', on:true},
    {key:'dailyRate', label:'Daily Wage Rate', on:true},

    {key:'ded', label:'Deductions', on:true},
    {key:'net', label:'Net', on:true}
  ]
};
function attKey(id,p){ return id+'|'+p; }
function attendanceFor(id,p){
  for(var i=0;i<DB.attendance.length;i++){
    var r=DB.attendance[i]; if(r.emp===id&&r.period===p) return r;
  }
  return null;
}
function lockFor(id,p){ return DB.salaryLock[attKey(id,p)]||null; }
function lockSalary(id,p){
  var snap=payDoc(emp(id),p,true);
  DB.salaryLock[attKey(id,p)]=Object.assign({},snap,{locked:true,lockedOn:stamp()});
  log('Salary locked for '+emp(id).name+' · '+p);
}
function unlockSalary(id,p){
  delete DB.salaryLock[attKey(id,p)];
  log('Salary unlocked for '+emp(id).name+' · '+p);
}
function stamp(){
  var d=new Date();
  var m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var h=d.getHours(), ap=h>=12?'PM':'AM'; h=h%12||12;
  return d.getDate()+' '+m[d.getMonth()]+' '+d.getFullYear()+', '+h+':'+String(d.getMinutes()).padStart(2,'0')+' '+ap;
}

/* ============================================================
   2. HELPERS
   ============================================================ */
function inrText(n){
  if(n==null||isNaN(n)) return '₹0';
  return '₹'+Number(Math.round(n)).toLocaleString('en-IN');
}
function inr(n){
  if(!canViewSalary()){
    return '<span class="locked-amt" onclick="requestSalaryAccess()" title="Salary figures are restricted"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>•••••</span>';
  }
  return inrText(n);
}

/* ---------- SALARY VISIBILITY PERMISSION ---------- */
function currentUserRec(){
  var u=DB.users.filter(function(x){ return x.name===state.currentUser; })[0];
  return u||DB.users[0];
}
function canViewSalary(){ return currentUserRec().access==='Full Access'; }
function maskAmt(n){
  return inr(n);
}
function requestSalaryAccess(){
  if(canViewSalary()){ toast('Salary access is already unlocked for '+state.currentUser+'.'); return; }
  openModal('<h3>Salary figures are locked</h3><p class="mp">'+esc(state.currentUser)+' has "Restricted" access. Switch to a user with Full Access to view amounts.</p>'+
    '<div class="field"><label for="switchUserSel">Switch user</label><select id="switchUserSel">'+
    DB.users.map(function(u){ return '<option value="'+esc(u.name)+'"'+(u.name===state.currentUser?' selected':'')+'>'+esc(u.name)+' — '+esc(u.access)+'</option>'; }).join('')+
    '</select></div>'+
    '<div class="modal-actions"><button class="btn-primary" type="button" onclick="switchUser(val(\'switchUserSel\'))">Switch &amp; unlock</button>'+
    '<button class="btn-outline" type="button" onclick="closeModal();go(\'admin.users\')">Manage access</button></div>');
}
function switchUser(name){
  state.currentUser=name;
  closeModal(); closeDoc();
  log('Switched active session to '+name+' ('+currentUserRec().access+')');
  render();
  toast(canViewSalary()?'Salary figures unlocked for '+name+'.':'Now viewing as '+name+' — salary figures remain restricted.');
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function initials(n){ return n.split(' ').map(function(w){return w[0];}).join('').slice(0,2).toUpperCase(); }
function monthsElapsed(){ var i=PERIODS.indexOf(state.period); return i<0?1:i+1; }
function fyLabel(){ return FY; }
function toast(msg){
  var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('up');
  clearTimeout(t._t); t._t=setTimeout(function(){ t.classList.remove('up'); },2600);
}
function empOptions(sel){
  return EMP.map(function(e){
    return '<option value="'+e.id+'"'+(e.id===sel?' selected':'')+'>'+esc(e.name)+' — '+e.id+'</option>';
  }).join('');
}
function periodOptions(sel){
  return PERIODS.map(function(p){ return '<option'+(p===sel?' selected':'')+'>'+p+'</option>'; }).join('');
}
function val(id){ var el=document.getElementById(id); return el?el.value.trim():''; }
function num(id){ var v=parseFloat(val(id)); return isNaN(v)?0:v; }
function markInvalid(id,bad){
  var el=document.getElementById(id); if(!el) return;
  var f=el.closest('.field'); if(f) f.classList.toggle('invalid',!!bad);
}
function require(ids){
  var ok=true;
  ids.forEach(function(id){ var bad=!val(id); markInvalid(id,bad); if(bad) ok=false; });
  if(!ok) toast('Fill the highlighted fields to continue.');
  return ok;
}
function amountInWords(n){
  if(!canViewSalary()){ return 'Amount in words is hidden — salary figures are restricted.'; }
  n=Math.round(n);
  var a=['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
  var b=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
  function two(x){ return x<20?a[x]:b[Math.floor(x/10)]+(x%10?' '+a[x%10]:''); }
  function three(x){ return (x>99?a[Math.floor(x/100)]+' hundred'+(x%100?' ':''):'')+(x%100?two(x%100):''); }
  if(n===0) return 'Rupees zero only.';
  var out='', cr=Math.floor(n/10000000); n%=10000000;
  var lk=Math.floor(n/100000); n%=100000;
  var th=Math.floor(n/1000); n%=1000;
  if(cr) out+=three(cr)+' crore ';
  if(lk) out+=three(lk)+' lakh ';
  if(th) out+=three(th)+' thousand ';
  if(n) out+=three(n);
  return 'Rupees '+out.trim().replace(/\s+/g,' ')+' only.';
}

function lopFor(id,p){ var d=0; DB.lop.forEach(function(r){ if(r.emp===id&&r.period===p) d+=Number(r.days); }); return d; }
function adhocFor(id,p){ var t=0; DB.adhoc.forEach(function(r){ if(r.emp===id&&r.period===p) t+=Number(r.amount); }); return t; }
function reimbFor(id,p){ var t=0; DB.reimb.forEach(function(r){ if(r.emp===id&&r.period===p&&r.status==='Approved') t+=Number(r.approved); }); return t; }
function emiFor(id){ var t=0; DB.loans.forEach(function(r){ if(r.emp===id) t+=Number(r.emi); }); return t; }

function payDoc(e,p,skipLock){
  if(!skipLock){
    var locked=lockFor(e.id,p);
    if(locked) return locked;
  }
  var att=attendanceFor(e.id,p);
  var workingDays = att && att.workingDays ? Number(att.workingDays) : daysInPeriod(p);
  var dailyRate = (att && att.dailyRate) ? Number(att.dailyRate) : (e.dailyRate || Math.max(100, Math.round(e.gross / workingDays)));

  var present, paidLeave, lop, payableDays;
  if(att){
    present = (att.present !== undefined && att.present !== null && att.present !== '') ? Number(att.present) : workingDays;
    paidLeave = Number(att.paidLeave) || 0;
    payableDays = att.payableDays !== undefined ? Number(att.payableDays) : (present + paidLeave);
    lop = (att.lop !== undefined && att.lop !== null && att.lop !== '') ? Number(att.lop) : Math.max(0, workingDays - payableDays);
  } else {
    var lopDays = lopFor(e.id,p);
    lop = lopDays;
    paidLeave = 0;
    payableDays = Math.max(0, workingDays - lopDays);
    present = payableDays;
  }

  // Base Gross calculation strictly from payable days * daily rate
  var baseGross = Math.round(payableDays * dailyRate);
  var standardGross = Math.round(workingDays * dailyRate);
  var lopAmt = Math.max(0, standardGross - baseGross);

  // Dynamic salary component breakdown based on earned gross
  var earnedBasic = Math.round(baseGross * 0.5);
  var earnedHra = Math.round(baseGross * 0.25);
  var earnedSpl = Math.max(0, baseGross - earnedBasic - earnedHra);

  var bonus = adhocFor(e.id,p);
  var emi = emiFor(e.id);
  var gross = baseGross + bonus;

  var pf = Math.min(Math.round(earnedBasic * 0.12), 3600);
  var pt = baseGross > 15000 ? 200 : (baseGross > 10000 ? 150 : (baseGross > 0 ? 100 : 0));
  var tds = Math.round(baseGross * 0.019 / 10) * 10;
  var ded = pf + pt + tds + emi;
  var net = gross - ded;

  return {
    workingDays: workingDays,
    dailyRate: dailyRate,
    dailyPay: dailyRate,
    present: present,
    paidLeave: paidLeave,
    lop: typeof lop === 'number' ? lop : Number(lop) || 0,
    payableDays: payableDays,
    lopAmt: lopAmt,
    earnedBasic: earnedBasic,
    earnedHra: earnedHra,
    earnedSpl: earnedSpl,
    bonus: bonus,
    emi: emi,
    gross: gross,
    pf: pf,
    pt: pt,
    tds: tds,
    ded: ded,
    net: net,
    locked: false
  };
}

function recalcPayslipEdit(){
  if(!EDIT_CTX) return;
  var e=emp(EDIT_CTX.emp), c=payDoc(e,EDIT_CTX.period);
  var basic=num2('pe-basic',e.basic), hra=num2('pe-hra',e.hra), spl=num2('pe-spl',e.spl);
  var pf=num2('pe-pf',e.pf), pt=num2('pe-pt',e.pt), tds=num2('pe-tds',e.tds);
  var bonus=c.bonus, emi=c.emi;
  var workingDays=c.workingDays, payableDays=c.present+c.paidLeave;
  var newFullGross=basic+hra+spl;
  var perDay=workingDays?newFullGross/workingDays:newFullGross;
  var baseGross=Math.round(perDay*payableDays);
  var gross=baseGross+bonus;
  var ded=pf+pt+tds+emi;
  var net=gross-ded;
  ['pe-out-gross','pe-out-gross2'].forEach(function(id){ var el=document.getElementById(id); if(el) el.textContent=inr(gross); });
  ['pe-out-ded','pe-out-ded2'].forEach(function(id){ var el=document.getElementById(id); if(el) el.textContent=inr(ded); });
  ['pe-out-net','pe-out-net2'].forEach(function(id){ var el=document.getElementById(id); if(el) el.textContent=inr(net); });
  var wordsEl=document.getElementById('pe-out-words'); if(wordsEl) wordsEl.textContent=amountInWords(net);
}

function navLabel(key){
  for(var i=0;i<NAV.length;i++){
    if(NAV[i].key===key) return [NAV[i].label,''];
    for(var j=0;j<NAV[i].children.length;j++){
      if(NAV[i].children[j][0]===key) return [NAV[i].label,NAV[i].children[j][1]];
    }
  }
  return ['Payroll',''];
}
function buildNav(){
  document.getElementById('sideNav').innerHTML = NAV.map(function(g){
    var top=state.section===g.key||state.section.indexOf(g.key+'.')===0;
    return '<div class="nav-group'+(top?' current open':'')+'" data-group="'+g.key+'">'+
      '<button type="button" class="nav-top" onclick="navTop(\''+g.key+'\')">'+
        '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+ICONS[g.icon]+'</svg>'+
        esc(g.label)+(g.children.length?'<span class="caret">▶</span>':'')+
      '</button>'+
      (g.children.length?'<div class="submenu">'+g.children.map(function(c){
        return '<button type="button" class="'+(state.section===c[0]?'on':'')+'" onclick="go(\''+c[0]+'\')">'+esc(c[1])+'</button>';
      }).join('')+'</div>':'')+
    '</div>';
  }).join('');
}
function navTop(key){
  var grp=document.querySelector('.nav-group[data-group="'+key+'"]');
  var g=NAV.filter(function(x){return x.key===key;})[0];
  if(!g.children.length){ go(key); return; }
  if(grp.classList.contains('open') && state.section.indexOf(key)===0){ grp.classList.remove('open'); return; }
  go(g.children[0][0]);
}
function go(key){
  state.section=key;
  buildNav();
  render();
  window.scrollTo({top:0,behavior:'instant'});
  if(window.innerWidth<=980) document.getElementById('sidebar').classList.remove('open');
}

function filterAttendanceTable(){
  var q = (val('attSearch')||'').toLowerCase();
  var dept = val('attDeptFilter') || 'All';
  var st = val('attStatusFilter') || 'All';
  var rows = document.querySelectorAll('#attTable tbody tr');
  var visible = 0;
  rows.forEach(function(r){
    if(r.classList.contains('empty-row')) return;
    var text = r.innerText.toLowerCase();
    var rDept = r.getAttribute('data-dept');
    var rLop = r.getAttribute('data-lop');
    var rLeave = r.getAttribute('data-leave');
    var rFull = r.getAttribute('data-full');

    var matchQ = !q || text.indexOf(q) >= 0;
    var matchDept = (dept === 'All' || rDept === dept);
    var matchSt = (st === 'All') ||
      (st === 'Full' && rFull === 'yes') ||
      (st === 'Lop' && rLop === 'yes') ||
      (st === 'Leave' && rLeave === 'yes');

    if(matchQ && matchDept && matchSt){
      r.style.display = '';
      visible++;
    } else {
      r.style.display = 'none';
    }
  });
  var countEl = document.getElementById('attCountLabel');
  if(countEl) countEl.textContent = 'Showing ' + visible + ' of ' + rows.length + ' active employees · Cycle: ' + state.period;
}

function recalcAttendancePreview(){
  var wd = num('atWorking') || daysInPeriod(val('atPeriod'));
  var rate = num('atRate') || 1000;
  var pr = num('atPresent'); if(isNaN(pr)) pr = wd;
  var pl = num('atLeave') || 0;
  var lop = num('atLop'); if(isNaN(lop)) lop = Math.max(0, wd - pr - pl);
  var payable = num('atPayable'); if(isNaN(payable)) payable = pr + pl;
  var gross = Math.round(payable * rate);

  var elWd = document.getElementById('prevWd'); if(elWd) elWd.textContent = wd;
  var elPr = document.getElementById('prevPresent'); if(elPr) elPr.textContent = pr;
  var elPl = document.getElementById('prevLeave'); if(elPl) elPl.textContent = pl;
  var elLop = document.getElementById('prevLop'); if(elLop) elLop.textContent = lop;
  var elPay = document.getElementById('prevPayable'); if(elPay) elPay.textContent = payable;
  var elR = document.getElementById('prevRate'); if(elR) elR.textContent = rate;
  var elGr = document.getElementById('prevGross'); if(elGr) elGr.textContent = inrText(gross);
}

  var payable = num('atPayable'); if(isNaN(payable)) payable = pr + pl;
  var key = val('atEmp') + '|' + val('atPeriod');

  if(lockFor(val('atEmp'), val('atPeriod'))){
    toast('Salary is locked for this employee and cycle. Unlock it first.');
    return;
  }

  DB.attendance = DB.attendance.filter(function(r){ return (r.emp + '|' + r.period) !== key; });
  DB.attendance.push({
    emp: val('atEmp'),
    period: val('atPeriod'),
    workingDays: wd,
    dailyRate: rate,
    present: pr,
    paidLeave: pl,
    lop: lop,
    payableDays: payable
  });

  var e = emp(val('atEmp'));
  if(e){
    e.dailyRate = rate;
    e.workDays = wd;
  }

  log('Day-wise attendance & wage recorded for ' + emp(val('atEmp')).name);
  render();
  toast('Attendance saved! ' + payable + ' payable days @ ₹' + rate + '/day applied to ' + emp(val('atEmp')).name + '.');

function dayOfWeekName(d, period){
  // Generate consistent day labels (Mon, Tue, Wed, Thu, Fri, Sat, Sun)
  var dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var pParts = (period || 'Aug 2026').split(' ');
  var mName = pParts[0] || 'Aug', yNum = parseInt(pParts[1]) || 2026;
  var mIndex = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'].indexOf(mName);
  if(mIndex < 0) mIndex = 7;
  var dateObj = new Date(yNum, mIndex, d);
  return dayNames[dateObj.getDay()];
}

  for(var d = 1; d <= numDays; d++){

      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;padding:0 4px">'+
        '<span style="font-size:11.5px;font-weight:700;color:var(--text)">Day '+d+'</span>'+
        '<span style="font-size:10.5px;font-weight:600;color:'+(isWeekend?'var(--purple)':'var(--text-dim)')+'">'+dow+'</span>'+
      '</div>'+
      '<select id="daySt_'+(d-1)+'" style="width:100%;text-align:center;padding:5px 2px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;background:'+(st==='P'?'#E9F8EE':st==='HD'?'#FEF3E2':st==='PL'?'#EAF1FF':st==='WO'?'#F3ECFE':'#FDECEC')+';color:'+(st==='P'?'#16A34A':st==='HD'?'#D97706':st==='PL'?'#2563EB':st==='WO'?'#7C3AED':'#DC2626')+'" onchange="updateDayLogStatus('+(d-1)+',this.value)">'+
        '<option value="P"'+(st==='P'?' selected':'')+'>P (Present 1d)</option>'+

        '<option value="WO"'+(st==='WO'?' selected':'')+'>WO (Off 1d)</option>'+
        '<option value="A"'+(st==='A'?' selected':'')+'>A (Absent 0d)</option>'+
      '</select>'+
      '<div style="font-size:10.5px;font-weight:600;color:var(--purple);margin-top:4px" id="dayEarn_'+(d-1)+'">₹'+earnedAmt+'</div>'+
    '</div>';
  }
  html += '</div></div>'+

function updateDayLogStatus(index, val){
  if(!window._DAY_LOG_CTX) return;
  window._DAY_LOG_CTX.daily[index] = val;
  var selEl = document.getElementById('daySt_' + index);
  if(selEl){
    selEl.style.background = (val==='P'?'#E9F8EE':val==='HD'?'#FEF3E2':val==='PL'?'#EAF1FF':val==='WO'?'#F3ECFE':'#FDECEC');
    selEl.style.color = (val==='P'?'#16A34A':val==='HD'?'#D97706':val==='PL'?'#2563EB':val==='WO'?'#7C3AED':'#DC2626');
  }
  var earnEl = document.getElementById('dayEarn_' + index);
  var earned = (val === 'P' || val === 'PL' || val === 'WO') ? window._DAY_LOG_CTX.rate : (val === 'HD' ? Math.round(window._DAY_LOG_CTX.rate * 0.5) : 0);
  if(earnEl) earnEl.textContent = '₹' + earned;
  recalcDayLogSummary();
}

  }

function setFiveDayWeek(){

function setSixDayWeek(){

function recalcDayLogSummary(){
  if(!window._DAY_LOG_CTX) return;
  var pr = 0, leave = 0, lop = 0;
  window._DAY_LOG_CTX.daily.forEach(function(st){
    if(st === 'P') pr += 1.0;
    else if(st === 'HD') { pr += 0.5; lop += 0.5; }
    else if(st === 'PL' || st === 'WO') leave += 1.0;
    else if(st === 'A') lop += 1.0;
  });
  var payable = Number((pr + leave).toFixed(1));
  var gross = Math.round(payable * window._DAY_LOG_CTX.rate);

  var prEl = document.getElementById('dayLogPresent'); if(prEl) prEl.textContent = pr + ' d';
  var lvEl = document.getElementById('dayLogLeave'); if(lvEl) lvEl.textContent = leave + ' d';
  var lopEl = document.getElementById('dayLogLop'); if(lopEl) lopEl.textContent = lop + ' d';
  var payEl = document.getElementById('dayLogPayable'); if(payEl) payEl.textContent = payable + ' d';
  var grEl = document.getElementById('dayLogTotalGross'); if(grEl) grEl.textContent = inr(gross);
}

function applyDayLogToAttendance(){
  if(!window._DAY_LOG_CTX) return;
  var ctx = window._DAY_LOG_CTX;
  var pr = 0, leave = 0, lop = 0;
  ctx.daily.forEach(function(st){
    if(st === 'P') pr += 1.0;
    else if(st === 'HD') { pr += 0.5; lop += 0.5; }
    else if(st === 'PL' || st === 'WO') leave += 1.0;
    else if(st === 'A') lop += 1.0;
  });
  var payable = Number((pr + leave).toFixed(1));

  var key = ctx.empId + '|' + ctx.period;
  DB.attendance = DB.attendance.filter(function(r){ return (r.emp + '|' + r.period) !== key; });
  DB.attendance.push({
    emp: ctx.empId,
    period: ctx.period,
    workingDays: ctx.numDays,
    dailyRate: ctx.rate,
    present: pr,
    paidLeave: leave,
    lop: lop,
    payableDays: payable,
    dailyLog: ctx.daily.slice()
  });

  var e = emp(ctx.empId);
  if(e){
    e.dailyRate = ctx.rate;
    e.workDays = ctx.numDays;
  }

  log('Day-by-day attendance recorded for ' + emp(ctx.empId).name);
  closeModal();
  render();
  toast('Day-wise attendance saved! Total ' + payable + ' payable days @ ₹' + ctx.rate + '/day applied to ' + emp(ctx.empId).name + '.');
}

function toggleLockSalary(id){
  if(lockFor(id,state.period)){
    unlockSalary(id,state.period);
    toast('Salary unlocked for '+emp(id).name);
  } else {
    lockSalary(id,state.period);
    toast('Salary locked for '+emp(id).name);
  }
  render();
}
function toggleHoldSalary(id){
  var idx=-1;
  for(var i=0; i<DB.stop.length; i++){
    if(DB.stop[i].emp===id){ idx=i; break; }
  }
  if(idx>=0){
    DB.stop.splice(idx,1);
    toast('Salary hold released for '+emp(id).name);
  } else {
    DB.stop.push({emp:id, period:state.period, reason:'Placed on hold in Process Dashboard'});
    toast('Salary placed on hold for '+emp(id).name);
  }
  render();
}

function addQsColumn(){
  var label=(val('qsNewLabel')||'').trim();
  if(!label){ toast('Enter a name for the new column.'); return; }
  var key='custom'+Date.now();

  log('Custom column added: '+label);
  openQsCustomize();
  toast('Column added. Click Save to apply.');
}
function removeQsColumn(i){
  var c=SETTINGS.qsColumns[i];
  if(!c||!c.custom) return;
  SETTINGS.qsColumns.splice(i,1);
  log('Custom column removed: '+c.label);
  openQsCustomize();
}
function saveQsCustomize(){
  SETTINGS.qsColumns.forEach(function(c,i){
    var onEl=document.getElementById('qsOn'+i), lblEl=document.getElementById('qsLabel'+i);
    if(onEl) c.on=onEl.checked;
    if(lblEl) c.label=lblEl.value.trim()||c.label;
  });

}

function saveRevision(){
  if(!require(['vEmp','vNew'])) return;
  var e=emp(val('vEmp')), oldCtc=e.gross*12+e.pf*12;
  if(num('vNew')<=0){ markInvalid('vNew',true); toast('Enter a revised CTC greater than zero.'); return; }
  DB.revision.push({emp:e.id,effective:val('vEffective'),oldCtc:oldCtc,newCtc:num('vNew'),reason:val('vReason'),status:'Planned'});
  log('Revision planned for '+e.name); render(); toast('Revision planned for '+e.name+' from '+val('vEffective')+'.');
}
function applyRevision(i){
  var r=DB.revision[i], e=emp(r.emp);
  var monthlyGross=Math.round(r.newCtc/12/1.12);
  e.basic=Math.round(monthlyGross*0.5); e.hra=Math.round(monthlyGross*0.25); e.spl=monthlyGross-e.basic-e.hra;
  e.gross=e.basic+e.hra+e.spl; e.pf=Math.min(Math.round(e.basic*0.12),3600);
  e.tds=Math.round(e.gross*0.019/10)*10; e.net=e.gross-(e.pf+e.pt+e.tds);
  r.status='Applied';
  log('Revision applied for '+e.name); render(); toast(e.name+' revised to '+inr(r.newCtc)+' CTC.');
}

  '<div class="grid-2"><div class="panel"><div class="panel-head"><h3>Schedule</h3></div><div class="panel-body"><table class="kv-table">'+
    '<tr><td>Pay cycle</td><td>Monthly</td></tr><tr><td>Cutoff</td><td>1st – 31st</td></tr>'+
    '<tr><td>Pay day</td><td>1st of the following month</td></tr><tr><td>Work week</td><td>Monday – Friday</td></tr>'+

  '<div class="panel"><div class="panel-head"><h3>Cycle locks</h3></div><div class="panel-body">'+
    PERIODS.slice(0,6).map(function(p){
      var locked=LOCKED.indexOf(p)>=0;
      return '<div class="row-item"><div><div class="ri-label">'+p+'</div><div class="ri-sub">'+(locked?'Locked, no edits allowed':'Open for edits')+'</div></div>'+
        '<button class="link-btn" type="button" onclick="toggleLock(\''+p+'\')">'+(locked?'Unlock':'Lock')+'</button></div>';
    }).join('')+'</div></div></div>';
};
function toggleLock(p){
  var i=LOCKED.indexOf(p);
  if(i>=0) LOCKED.splice(i,1); else LOCKED.push(p);
  log((i>=0?'Unlocked ':'Locked ')+p); render(); toast(p+(i>=0?' unlocked.':' locked.'));
}

/* global search jumps to a page or an employee */
var SEARCH_INDEX=[];
NAV.forEach(function(g){
  SEARCH_INDEX.push({label:g.label,key:g.children.length?g.children[0][0]:g.key});
  g.children.forEach(function(c){ SEARCH_INDEX.push({label:g.label+' › '+c[1],key:c[0]}); });
});
function runSearch(q){
  q=q.trim().toLowerCase(); if(!q) return;
  var e=EMP.filter(function(x){ return (x.name+' '+x.id).toLowerCase().indexOf(q)>=0; })[0];
  if(e){ viewEmployee(e.id); toast('Opened '+e.name+'.'); return; }
  var hit=SEARCH_INDEX.filter(function(s){ return s.label.toLowerCase().indexOf(q)>=0; })[0];
  if(hit){ go(hit.key); toast('Opened '+hit.label+'.'); return; }
  toast('No page or employee matches "'+q+'".');
}

/* ============================================================
   7. RENDER LOOP
   ============================================================ */
function render(){
  var fn=PAGE[state.section]||PAGE['payroll'];
  var lbl=navLabel(state.section);
  document.getElementById('crumb').innerHTML='Home <span style="color:#C9C9D2">›</span> <b>'+esc(lbl[0])+'</b>'+
    (lbl[1]?' <span style="color:#C9C9D2">›</span> '+esc(lbl[1]):'');
  document.getElementById('pageBody').innerHTML=fn();
  var badge=document.getElementById('accessBadge');
  if(badge){
    var unlocked=canViewSalary();
    badge.innerHTML='<button type="button" class="access-badge '+(unlocked?'full':'restricted')+'" onclick="'+(unlocked?'openProfile()':'requestSalaryAccess()')+'">'+
      (unlocked?'🔓 Salary unlocked':'🔒 Salary restricted')+'</button>';
  }
}
function boot(){
  var sel=document.getElementById('periodSelect');
  sel.innerHTML=periodOptions(state.period);
  sel.addEventListener('change',function(){ setPeriod(this.value); });
  var gs=document.getElementById('globalSearch');
  gs.addEventListener('keydown',function(e){ if(e.key==='Enter'){ runSearch(this.value); this.blur(); } });
  buildNav(); render();
}
boot();
</script>
